<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FoodLog" />
  <title>FoodLog</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="/food.css" />
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="header-inner">
        <h1 class="app-title">FoodLog</h1>
        <div class="date-nav">
          <button class="nav-btn" id="prevDay">&#8249;</button>
          <span class="current-date" id="currentDate"></span>
          <button class="nav-btn" id="nextDay">&#8250;</button>
        </div>
      </div>
    </header>

    <main class="main-content">
      <section class="totals-bar" id="totalsBar">
        <div class="total-item">
          <span class="total-label">Calories</span>
          <span class="total-value" id="totalCalories">—</span>
        </div>
        <div class="total-item">
          <span class="total-label">Protein</span>
          <span class="total-value protein" id="totalProtein">—</span>
        </div>
        <div class="total-item">
          <span class="total-label">Carbs</span>
          <span class="total-value carbs" id="totalCarbs">—</span>
        </div>
        <div class="total-item">
          <span class="total-label">Fat</span>
          <span class="total-value fat" id="totalFat">—</span>
        </div>
      </section>

      <div class="tab-bar">
        <button class="tab-btn active" data-tab="today">Today</button>
        <button class="tab-btn" data-tab="week">Week</button>
        <button class="tab-btn" data-tab="calendar">Month</button>
      </div>

      <div class="tab-content" id="tab-today">
        <div id="mealCards" class="meal-cards">
          <div class="loading-state">
            <div class="spinner"></div>
            <p>Loading entries…</p>
          </div>
        </div>
      </div>

      <div class="tab-content hidden" id="tab-week">
        <div class="chart-card">
          <h3 class="chart-title">7-Day Calories</h3>
          <canvas id="weekChart"></canvas>
        </div>
        <div id="weekDays" class="week-days"></div>
      </div>

      <div class="tab-content hidden" id="tab-calendar">
        <div class="cal-header">
          <button class="nav-btn" id="calPrev">&#8249;</button>
          <span class="cal-month-label" id="calMonthLabel"></span>
          <button class="nav-btn" id="calNext">&#8250;</button>
        </div>
        <div class="cal-dow-row">
          <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span>
          <span>Thu</span><span>Fri</span><span>Sat</span>
        </div>
        <div id="calGrid" class="cal-grid">
          <div class="loading-state"><div class="spinner"></div></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    window.API_BASE = '__API_BASE__';
  </script>
  <script src="/food.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js');
    }
  </script>
</body>
</html>
